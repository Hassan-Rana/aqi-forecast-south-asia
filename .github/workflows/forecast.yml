name: Update data, evaluate and forecast

on:
  workflow_dispatch:
  schedule:
    - cron: "17 1 * * *"   # daily, 06:47 IST / 06:17 PKT
  push:
    branches: [main]
    paths: ["aqi/**", "data/events.csv", ".github/workflows/forecast.yml"]

permissions:
  contents: write

concurrency:
  group: forecast
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install numpy pandas scikit-learn requests joblib tabulate pytest
      - name: Tests
        run: python -m pytest -q
      - name: Download history (Open-Meteo CAMS + ERA5)
        run: python -m aqi fetch
      - name: Evaluate on the last 12 months
        run: python -m aqi evaluate
      - name: Occasion impact
        run: python -m aqi impact
      - name: Train on all data and forecast every city
        run: |
          python -m aqi train
          python -m aqi forecast all
      - name: Commit data and reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw reports
          git diff --cached --quiet || git commit -m "Update data, evaluation and forecast [skip ci]"
          git pull --rebase
          git push
